spring.application.name=graphrag
logging.level.root=INFO
spring.autoconfigure.exclude=org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration,org.springframework.ai.vectorstore.neo4j.autoconfigure.Neo4jVectorStoreAutoConfiguration

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=notverysecret

app.neo4j.database=neo4j

app.model.base-url=https://api.openai.com/v1
app.model.api-key=${OPENAI_API_KEY:}
app.model.embedding-model=text-embedding-3-small
app.model.embedding-dimensions=1536
app.model.chat-model=gpt-5-mini

spring.ai.openai.base-url=${app.model.base-url}
spring.ai.openai.api-key=${app.model.api-key}
spring.ai.openai.embedding.options.model=${app.model.embedding-model}
spring.ai.openai.chat.options.model=${app.model.chat-model}

app.storage.documents-root=./var/documents
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

app.chunking.max-tokens=800
app.chunking.overlap-tokens=80
app.chunking.max-characters=4000

app.query.max-rows=200
app.query.timeout-seconds=15
app.query.require-limit=true
app.query.blocked-keywords=CREATE,MERGE,SET,DELETE,DETACH,REMOVE,DROP,LOAD CSV,CALL

app.extraction.max-entities-per-chunk=40
app.extraction.max-relationships-per-chunk=80
app.extraction.max-retries=2
