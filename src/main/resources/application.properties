spring.application.name=graphrag
logging.level.root=INFO
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.neo4j.autoconfigure.Neo4jVectorStoreAutoConfiguration

management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.probes.enabled=true
management.tracing.enabled=false
management.tracing.export.otlp.enabled=false
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=

spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=notverysecret

app.neo4j.database=neo4j

spring.datasource.url=${GRAPHRAG_POSTGRES_URL:jdbc:postgresql://localhost:5433/graphrag}
spring.datasource.username=${GRAPHRAG_POSTGRES_USER:graphrag}
spring.datasource.password=${GRAPHRAG_POSTGRES_PASSWORD:graphrag-local-postgres}
spring.datasource.hikari.maximum-pool-size=${GRAPHRAG_POSTGRES_MAXIMUM_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${GRAPHRAG_POSTGRES_MINIMUM_IDLE:2}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=app
spring.flyway.default-schema=app
spring.flyway.schemas=app
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

app.model.base-url=https://api.openai.com/v1
app.model.api-key=${OPENAI_API_KEY:}
app.model.embedding-model=text-embedding-3-small
app.model.embedding-dimensions=1536
app.model.chat-model=gpt-5-mini

app.ai.observability.enabled=false
app.ai.observability.content-capture-enabled=false
app.ai.observability.max-attribute-length=512
app.ai.observability.input-output-content-enabled=true
app.ai.observability.max-input-output-length=1048576
app.ai.observability.model-name-tag-enabled=true
app.ai.observability.schema-name-tag-enabled=true

spring.ai.openai.base-url=${app.model.base-url}
spring.ai.openai.api-key=${app.model.api-key}
spring.ai.openai.embedding.options.model=${app.model.embedding-model}
spring.ai.openai.chat.options.model=${app.model.chat-model}

app.storage.documents-root=./var/documents
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

app.chunking.max-tokens=800
app.chunking.overlap-tokens=80
app.chunking.max-characters=4000

app.query.max-rows=200
app.query.timeout-seconds=15
app.query.require-limit=true
app.query.blocked-keywords=CREATE,MERGE,SET,DELETE,DETACH,REMOVE,DROP,LOAD CSV,CALL
app.query.hybrid-search-default-top-k=10
app.query.hybrid-search-max-top-k=50
app.query.hybrid-search-candidate-multiplier=4
app.query.hybrid-search-max-candidates=200
app.query.hybrid-search-default-graph-depth=1
app.query.hybrid-search-max-graph-depth=2
app.query.hybrid-search-include-chunk-text=true

app.extraction.max-entities-per-chunk=100
app.extraction.max-relationships-per-chunk=200
app.extraction.max-retries=2

app.schema-discovery.max-sources=12
app.schema-discovery.max-source-bytes=5242880
app.schema-discovery.max-total-bytes=20971520
app.schema-discovery.max-source-characters=200000
app.schema-discovery.max-total-characters=600000
app.schema-discovery.chunk-characters=12000
app.schema-discovery.max-chunks-per-source=20
app.schema-discovery.max-concurrency=4
app.schema-discovery.source-timeout-seconds=60
app.schema-discovery.request-timeout-seconds=180

app.schema-draft.analysis.concurrency=2
app.schema-draft.analysis.queue-capacity=16
app.schema-draft.evaluation.concurrency=2
app.schema-draft.evaluation.queue-capacity=16
app.schema-draft.evaluation.minimum-successful-documents=1
app.schema-draft.evaluation.required-for-publication=true
app.schema-draft.evaluation.advisory-enabled-by-default=false
app.schema-reprocessing.concurrency=2
app.schema-reprocessing.queue-capacity=16
