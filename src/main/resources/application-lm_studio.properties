spring.autoconfigure.exclude=
spring.ai.model.chat=openai
spring.ai.model.embedding=openai

app.model.base-url=http://10.235.1.241:1234/v1
app.model.api-key=${LM_STUDIO_API_KEY:lm-studio}
app.model.embedding-model=nomic-ai/nomic-embed-text-v1.5
app.model.embedding-dimensions=768
app.model.chat-model=qwen/qwen3.6-35b-a3b

spring.ai.openai.base-url=${app.model.base-url}
spring.ai.openai.api-key=${app.model.api-key}
spring.ai.openai.timeout=600s
spring.ai.openai.chat.timeout=600s
spring.ai.openai.embedding.timeout=300s
spring.ai.openai.embedding.options.model=${app.model.embedding-model}
spring.ai.openai.chat.options.model=${app.model.chat-model}
