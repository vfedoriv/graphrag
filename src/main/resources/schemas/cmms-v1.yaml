name: cmms
version: 1
description: Schema for computerized maintenance management system data
nodes:
  - label: Asset
    description: Physical equipment or machine
    key: assetId
    properties:
      - name: assetId
        type: string
        required: true
      - name: name
        type: string
      - name: location
        type: string
      - name: criticality
        type: string
  - label: WorkOrder
    description: Maintenance work order
    key: workOrderId
    properties:
      - name: workOrderId
        type: string
        required: true
      - name: title
        type: string
      - name: status
        type: string
      - name: priority
        type: string
      - name: dueDate
        type: date
  - label: Technician
    description: Maintenance technician
    key: technicianId
    properties:
      - name: technicianId
        type: string
        required: true
      - name: fullName
        type: string
      - name: skillLevel
        type: string
  - label: MaintenancePlan
    description: Preventive maintenance plan
    key: planId
    properties:
      - name: planId
        type: string
        required: true
      - name: frequency
        type: string
      - name: active
        type: boolean
relationships:
  - type: WORK_ORDER_FOR
    from: WorkOrder
    to: Asset
    description: Work order targets an asset
  - type: ASSIGNED_TO
    from: WorkOrder
    to: Technician
    description: Work order assigned to technician
  - type: GENERATED_FROM_PLAN
    from: WorkOrder
    to: MaintenancePlan
    description: Work order generated by a maintenance plan
  - type: PLAN_FOR
    from: MaintenancePlan
    to: Asset
    description: Plan applies to an asset
indexes:
  - label: Asset
    properties: [assetId]
    unique: true
  - label: WorkOrder
    properties: [workOrderId]
    unique: true
  - label: Technician
    properties: [technicianId]
    unique: true
  - label: MaintenancePlan
    properties: [planId]
    unique: true
vectorIndexes:
  - name: document_chunk_embedding
    label: DocumentChunk
    property: embedding
    dimensions: 1536
    similarity: cosine
