metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

# Local development is intentionally a single failure domain.
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "langfuse-garage:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
