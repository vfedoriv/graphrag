name: Documentation

on:
  push:
    branches: [dev]
    paths:
      - README.md
      - AGENTS.md
      - CLAUDE.md
      - docs/**
      - src/site/**
      - pom.xml
      - src/test/java/io/github/vfedoriv/graphrag/logging/DocumentationAlignmentTest.java
      - .github/workflows/documentation.yml
  pull_request:
    paths:
      - README.md
      - AGENTS.md
      - CLAUDE.md
      - docs/**
      - src/site/**
      - pom.xml
      - src/test/java/io/github/vfedoriv/graphrag/logging/DocumentationAlignmentTest.java
      - .github/workflows/documentation.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Check documentation alignment
        run: ./mvnw test -Pfast -Dtest=DocumentationAlignmentTest

      - name: Build Maven Site
        run: ./mvnw site

      - name: Check generated portal entries and Mermaid resource
        run: |
          test -f target/site/index.html
          test -f target/site/getting-started/local-setup.html
          test -f target/site/workflows/advanced-search.html
          test -f target/site/contributing/documentation.html
          test -f target/site/js/mermaid-init.js
          grep -F 'mermaid@11.15.0' target/site/js/mermaid-init.js
